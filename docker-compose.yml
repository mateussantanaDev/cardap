services:
  # BANCO DE DADOS POSTGRESQL UNIFICADO DO CARDAP ERP & EVOLUTION
  cardap_postgres:
    image: postgres:16-alpine
    container_name: cardap_postgres
    restart: always
    environment:
      POSTGRES_USER: cardap_admin
      POSTGRES_PASSWORD: cardap_secret_password_2026
      POSTGRES_DB: cardap_db
    ports:
      - '5432:5432'
    volumes:
      - cardap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardap_admin -d cardap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # CACHE & PUB/SUB REDIS DO CARDAP ERP & EVOLUTION
  cardap_redis:
    image: redis:7-alpine
    container_name: cardap_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - cardap_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # CARDAP ERP GESTÃO B2B (PORTA 3000)
  cardap_gestao:
    build:
      context: .
      dockerfile: apps/gestao/Dockerfile
    container_name: cardap_gestao_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'postgresql://cardap_admin:cardap_secret_password_2026@cardap_postgres:5432/cardap_db?schema=public'
      REDIS_URL: 'redis://cardap_redis:6379'
      JWT_SECRET: 'cardap-secret-key-2026'
      EVO_CRM_URL: 'http://localhost:8085'
    depends_on:
      cardap_postgres:
        condition: service_healthy
      cardap_redis:
        condition: service_healthy

  # CARDAP VITRINE DIGITAL & CARDÁPIO ONLINE B2C (PORTA 3001)
  cardap_vitrine:
    build:
      context: .
      dockerfile: apps/vitrine/Dockerfile
    container_name: cardap_vitrine_app
    restart: always
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: 'postgresql://cardap_admin:cardap_secret_password_2026@cardap_postgres:5432/cardap_db?schema=public'
      REDIS_URL: 'redis://cardap_redis:6379'
      JWT_SECRET: 'cardap-secret-key-2026'
    depends_on:
      cardap_postgres:
        condition: service_healthy
      cardap_redis:
        condition: service_healthy

  # EVOLUTION API V2 — WHATSAPP ENGINE & API (PORTA 8080)
  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - '8080:8080'
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: 'http://localhost:8080'
      CORS_ORIGIN: '*'
      CORS_METHODS: 'GET,POST,PUT,DELETE'
      CORS_CREDENTIALS: 'true'
      LOG_LEVEL: 'ERROR,WARN,INFO'
      LOG_COLOR: 'true'
      DEL_INSTANCE: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: 'postgresql://cardap_admin:cardap_secret_password_2026@cardap_postgres:5432/cardap_db?schema=evolution_api'
      AUTHENTICATION_API_KEY: '429683C4C977415CAAFCCE10F7D57E11'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: 'redis://cardap_redis:6379/1'
      CACHE_REDIS_PREFIX_KEY: 'evolution'
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      cardap_postgres:
        condition: service_healthy
      cardap_redis:
        condition: service_healthy

  # EVOLUTION MANAGER — PAINEL WEB INTERATIVO EMBUTIDO NO CRM (PORTA 8085)
  evolution_manager:
    image: evoapicloud/evolution-manager:latest
    container_name: evolution_manager
    restart: always
    ports:
      - '8085:80'
    environment:
      API_URL: 'http://localhost:8080'
    volumes:
      - ./docker/nginx-manager.conf:/etc/nginx/conf.d/nginx.conf:ro
    depends_on:
      - evolution_api

volumes:
  cardap_postgres_data:
  cardap_redis_data:
  evolution_instances:
