services:
  # BANCO DE DADOS POSTGRESQL UNIFICADO DO CARDAP ERP
  cardap_postgres:
    image: postgres:16-alpine
    container_name: cardap-postgres
    restart: always
    environment:
      POSTGRES_USER: cardap_admin
      POSTGRES_PASSWORD: cardap_secret_password_2026
      POSTGRES_DB: cardap_db
    ports:
      - '5432:5432'
    volumes:
      - cardap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardap_admin -d cardap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # CACHE & PUB/SUB REDIS DO CARDAP ERP
  cardap_redis:
    image: redis:7-alpine
    container_name: cardap-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - cardap_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # WAHA — WHATSAPP HTTP API & BOT ENGINE (PORTA 3008)
  cardap_waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: cardap-waha
    restart: always
    ports:
      - '3008:3000'
    environment:
      WHATSAPP_HOOK_URL: 'http://cardap-gestao:3000/api/waha/webhook'
      WHATSAPP_HOOK_EVENTS: 'message,message.any,session.status'
      WAHA_DASHBOARD_ENABLED: 'true'
      WAHA_DASHBOARD_USERNAME: 'admin'
      WAHA_DASHBOARD_PASSWORD: 'cardap_secret_2026'
      WAHA_API_KEY: 'cardap_waha_api_key_2026'
      WAHA_ZIP_LOGS: 'false'
      WAHA_PRINT_QR: 'false'
    volumes:
      - waha_sessions:/app/.sessions

  # CARDAP ERP GESTÃO B2B (PORTA 3000)
  cardap_gestao:
    build:
      context: .
      dockerfile: apps/gestao/Dockerfile
    container_name: cardap-gestao
    restart: always
    ports:
      - '${PORT_GESTAO:-3002}:3000'
    environment:
      DATABASE_URL: 'postgresql://cardap_admin:cardap_secret_password_2026@cardap-postgres:5432/cardap_db?schema=public'
      REDIS_URL: 'redis://cardap-redis:6379'
      JWT_SECRET: 'cardap-secret-key-2026'
      WAHA_API_URL: 'http://cardap-waha:3000'
      WAHA_API_KEY: 'cardap_waha_api_key_2026'
      WAHA_SESSION: 'default'
    depends_on:
      cardap_postgres:
        condition: service_healthy
      cardap_redis:
        condition: service_healthy
      cardap_waha:
        condition: service_started

  # CARDAP VITRINE DIGITAL & CARDÁPIO ONLINE B2C (PORTA 3001)
  cardap_vitrine:
    build:
      context: .
      dockerfile: apps/vitrine/Dockerfile
    container_name: cardap-vitrine
    restart: always
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: 'postgresql://cardap_admin:cardap_secret_password_2026@cardap-postgres:5432/cardap_db?schema=public'
      REDIS_URL: 'redis://cardap-redis:6379'
      JWT_SECRET: 'cardap-secret-key-2026'
    depends_on:
      cardap_postgres:
        condition: service_healthy
      cardap_redis:
        condition: service_healthy

volumes:
  cardap_postgres_data:
  cardap_redis_data:
  waha_sessions:
