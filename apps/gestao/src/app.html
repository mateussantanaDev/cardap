<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
	<head>
		<meta charset="utf-8" />
		<!-- Favicons & App Icons -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />

		<!-- Viewport & Mobile Controls -->
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
		<meta name="theme-color" content="#0f172a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Cardap ERP" />

		<!-- ERP Base SEO / Restrito -->
		<title>Cardap ERP — Sistema Integrado de Gestão Gastronômica</title>
		<meta name="description" content="Painel ERP completo para restaurantes: PDV rápido, KDS de cozinha, mapa de salão e mesas, controle financeiro DRE e catálogo digital." />
		<meta name="robots" content="noindex, nofollow" />

		<!-- Web Fonts Preconnect -->
		<link rel="preconnect" href="https://rsms.me/" crossorigin />
		<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport" class="bg-slate-50 text-slate-900 antialiased selection:bg-slate-900 selection:text-white h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
