<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  
  <!-- Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#fca5a5" stroke-width="8" stroke-opacity="0.35" />

  <!-- Letter C Glyph in Bold Monospace Aesthetic -->
  <path d="M 370 160 C 340 120 290 100 230 100 C 140 100 80 170 80 256 C 80 342 140 412 230 412 C 290 412 340 392 370 352 L 320 310 C 300 335 270 348 230 348 C 175 348 144 305 144 256 C 144 207 175 164 230 164 C 270 164 300 177 320 202 Z" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Subtle Fork/Knife Sparkle Glyph -->
  <circle cx="390" cy="130" r="24" fill="#fbbf24" />
</svg>
